[loggers]
keys=root

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=consoleFormatter,fileFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler,fileHandler

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=consoleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=ERROR
formatter=fileFormatter
args=('TelegramBot.log', 'w', 'utf-8')

[formatter_consoleFormatter]
format=🟢 %(asctime)s | Line:%(lineno)d | Module:%(module)s | Level:%(levelname)s | Msg:%(message)s
datefmt=%I:%M:%S %p

[formatter_fileFormatter]
format=📁 [%(asctime)s | %(name)s | Line:%(lineno)d | %(levelname)s] Msg:%(message)s
datefmt=%m/%d/%Y %I:%M:%S %p
